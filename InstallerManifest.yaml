    PackageUrl: https://github.com/Mike-Aniki/Aniki-ReMake/releases/download/v1.6/Aniki_ReMake_bb8728bd-ac83-4324-88b1-ee5c586527d1_1_6.pthm
    Changelog:
      - 16/10 Resolution Support - Theme now auto-adjusts for both 16/10 and 16/9 resolutions (settings menu needs manual selection)
      - Default Solid Background - Displays a solid background if no wallpaper is available
      - Trailer Management Options
          - Option to disable trailers in detail view
          - Enable trailers on the main page
          - Mini trailers in detail view (inspired by Remix)
      - Trophy Display by Rarity - Displays unlocked trophies sorted by rarity (Bronze, Silver, Gold, Platinum)
      - Plugin Integration
          - CheckDLC Plugin - Button in detail view to view available DLCs for games
          - Screenshot Visualizer Plugin - Button in detail view for viewing game screenshots
          - BackgroundChanger Plugin - Theme supports the BackgroundChanger plugin
      - Conditional Button Display - Achievements, DLC, and Screenshot buttons only appear if data is available, simplifying the UI
      - Interface Element Style Customization - Option to customize corner styles (square, slightly rounded, or rounded). Requires ThemeOption v0.13
      - Completed Games Count - Indicator on main view for total completed games (toggle available in settings; counts only games with status "Completed")
      - Feature Icons in Detail View - Added game feature icons in detail view
      - Improved Interfaces
          - New login screens
          - Updated interface designs for better coherence
          - Improved text descriptions in theme settings
          - Enhanced color consistency
          - Optimized animations for smoother performance
          - Refined trophy view style
      - Bug Fixes
          - Sound Fixes - Resolved various sound issues including
              - Login screen music overlapping with intro video
              - Music delay on main screen after closing login screen
              - Trailer-related sound issues
          - Trophy View Fix - Trophy view now closes automatically when switching views
          - Font Update - Changed font in vertical view from SST to SEGUI
      - Various minor adjustments and optimizations
      - Updated Step-by-Step Guide on GitHub
