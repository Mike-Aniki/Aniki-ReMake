  - Version: 3.0
    RequiredApiVersion: 2.9.0
    ReleaseDate: 2026-04-26
    PackageUrl: https://github.com/Mike-Aniki/Aniki-ReMake/releases/download/v3.0/Aniki_ReMake_bb8728bd-ac83-4324-88b1-ee5c586527d1_3_0.pthm
    Changelog:
        - v3.0 is a major visual and structural rework of the theme.
        - Please update Playnite to the latest version (v10.52).
        - The latest version of Aniki Helper (v1.3.1) is required. 
        - Added interface sounds using the Aniki Helper plugin; Playnite Sound is no longer needed for interface sounds.
        - Added a new video intro/outro system via Aniki Helper(1.3.1).
        - The old static Welcome View has been replaced with a true interactive and navigable Home / Hub view.
        - The Home / Hub has been fully redesigned with a cleaner, more dynamic page-based system closer to a modern console interface.
        - The old Stats view has been transformed into a Profile view, also fully navigable and redesigned in the same spirit as the Home / Hub.
        - The Friends view has been improved with the ability to open your Steam friends’ profiles via Steam Friends Fullscreen(v1.8.1).
        - Theme color presets are now separated from background visuals, allowing you to freely mix interface styles and background visuals.
        - The top bar has been reworked with the addition of the avatar, username, Steam status, and a clearer presentation of actions.
        - The Quick Options panel has been redesigned as a side panel.
        - Added a Steam Store view that displays games featured by Steam.
        - Added a new “List” main view for a more compact way to browse the library.
        - Added an option to place the main / settings menu on the left or right.
        - Several Theme Colors presets have been reworked and new ones have been added.
        - Several secondary views have also been improved.
        - Some UI sounds have been updated, and an issue where background music could keep looping continuously has been fixed.
        - The Extra Metadata trailer player is back in the main view for users who use streaming without performance issues.
        - PlayniteAchievements integration has been significantly improved with a new options window directly inside the theme.
        - Trophies can now be sorted by rarity, unlock date, unlocked / locked state, and hidden trophies can now be revealed via PlayniteAchievements.
        - Added progress tracking for achievements that support it via PlayniteAchievements.
        - Capstone trophies are now visually differentiated for a more console-like presentation via PlayniteAchievements.
        - Fixed an issue where some trophies could display the wrong gold icon.
        - Various improvements and visual adjustments.
        - Thanks to all the beta testers, your feedback has really helped!
        - Thank you all for your support, I hope you enjoy this new version.
