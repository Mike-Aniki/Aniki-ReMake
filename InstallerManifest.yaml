  - Version: 3.2.0
    RequiredApiVersion: 2.9.0
    ReleaseDate: 2026-06-10
    PackageUrl: https://github.com/Mike-Aniki/Aniki-ReMake/releases/download/v3.2.0/Aniki_ReMake_bb8728bd-ac83-4324-88b1-ee5c586527d1_3_2_0.pthm
    Changelog:
        - IMPORTANT The latest version of the Aniki Helper plugin v1.4.0 is required for this theme update.
        - 
        - Removed the dependency on ThemeOptions. The theme no longer requires ThemeOptions to work.
        - All theme options will be reset on the first launch after updating.
        - Fully redesigned the theme options menu, now with previews, descriptions, and categories.
        - Replaced the Main Menu with the Quick Access Menu.
        - Added a new Signature details layout.
        - Added screenshot and achievement memories to the hub. 
        - Added an option to display Gamerscore instead of player level.
        - Added an option to hide the filtered games count in the vertical view.
        - Added an option to hide categories in the details views.
        - Added an option to completely disable the bottom bar.
        - Added an option to use a custom folder for filter images/icons through Aniki Helper.
        - Added a Night Mode option for UniPlaySong in the Quick Options menu.
        - The source logo on the main view now moves to the top of the screen when auto-hide top bar is enabled.
        - Adjusted platform/source banners on game covers.
        - Improved navigation for the top bar and bottom bar.
        - Separated the game list background frame and controller shortcut frame. They can now be enabled or disabled independently.
        - Added a button to open Steam Chat from the Friends view.
        - Improved and polished several UI elements across the theme.
        - Fixed avatars from number 30 and above not showing in some views.
        - Fixed theme colors no longer working when the latest versions of the HLTB and Game Activity plugins were installed.
        - Fixed and improved several miscellaneous issues.
  - Version: 3.3.0
    RequiredApiVersion: 2.9.0
    ReleaseDate: 2026-07-11
    PackageUrl: https://github.com/Mike-Aniki/Aniki-ReMake/releases/download/v3.3.0/Aniki_ReMake_bb8728bd-ac83-4324-88b1-ee5c586527d1_3_3_0.pthm
    Changelog:
        - The theme now checks whether the required version of Aniki Helper is installed.
        - A compatibility warning will be displayed if Aniki Helper is missing or outdated.
        - Steam Friends Fullscreen support has been removed from the theme and is now integrated directly into Aniki Helper.
        - You must now connect your Steam account from the Aniki Helper settings to use Steam-related features in Aniki ReMake.        
        - Added Lucky Mode, which has a rare 2% chance of activating when the theme starts.
        - The luckiest players may discover a special version of Aniki ReMake at launch.
        - Added an Easter Egg Mode that can be activated with a specific controller input sequence from the Login Screen or the Library.
        - The sequence begins with two presses on the Up directional button. Old-school players should know the rest...
        - Completely reworked the Hub with a new horizontal navigation system, making it easier to move between the top bar and the content.
        - Added a new Friends Activity page to the Hub.
        - Added an option to display four applications from Playnite’s Software section directly on the Hub through Aniki Helper.
        - Replaced the old Suggested card with a new News From Your Library card.
        - This card displays rotating Steam content related to games in your library, including DLC, events, updates, news, announcements, trailers, and more.
        - Added Source B news and Playnite add-on update news to the Hub news card.
        - Added a new Suggested page to the Hub with four recommended games from your own library.
        - Completely reworked the Store view with a new layout, improved navigation, and cleaner cards.
        - Added Upcoming Games, Most Wishlisted Games, Popular New Releases, For You, and Wishlist sections.
        - A connected Steam account in Aniki Helper is required to use the For You and Wishlist sections.
        - Added a zoom effect when a card receives focus in the Hub, Store, and Profile views.
        - Added in-game achievement unlock notifications through PlayniteAchievements 3.0.
        - Achievement notifications must be enabled in PlayniteAchievements, while notification sounds must be enabled in UniPlaySong.
        - This feature is the result of close collaboration between PlayniteAchievements, UniPlaySong, and Aniki ReMake.
        - PlayniteAchievements handles the notifications, UniPlaySong handles the sounds, and Aniki ReMake handles the visual style.
        - Special thanks to JDD and Huddini for their continued work and support. Please consider supporting their projects.
        - Added a new Friends Achievements view through PlayniteAchievements 3.0, displaying the complete achievement list for your friends.
        - Added support for the new PlayniteAchievements dynamic list system, providing more filtering and sorting options.
        - Improved the in-game overlay with several new features.
        - Added quick access to Audio Switcher controls, UniPlaySong, recent screenshots, achievements, and the UniPlaySong music player.
        - Added Windows volume control and separate volume control for the currently running game through Audio Switcher.
        - Added a music player for UniPlaySong’s Radio and Spotify features.
        - Improved the behavior and stability of the overlay during gameplay.
        - Added support for the new Aniki Helper option that temporarily suspends the game while the overlay is open, helping prevent double inputs.
        - Added support for DuplicateHider.
        - Added an option to use your Steam avatar instead of the theme avatar.
        - Increased the maximum number of game list columns from 9 to 10.
        - The number of columns can now be configured from 6 to 10, allowing you to use larger or smaller game covers.
        - Added an option to display platform banners above the covers or directly on them.
        - Added separate On Cover banner images, allowing a different visual style for each banner mode.
        - Added a new option to display the game source logo in the bottom-right corner of the cover.
        - Moved the source logo capsule to the top-right corner of the screen, aligned with the achievement capsule for a cleaner layout.
        - Updated Steam background compatibility mode by replacing the game frame with a black fade.
        - Adjusted shading layers to reduce visible banding on certain displays.
        - Added new Visual Packs created by Ammz.
        - Added new color presets.
        - Updated the opening animations of several views.
        - Updated and reorganized several options in the Quick Options menu.
        - Added various visual adjustments and minor fixes.
        - Cleaned up the code and made several stability improvements.
