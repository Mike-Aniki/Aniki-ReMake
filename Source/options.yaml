Variables:

    GlobalSeparation:
        Title: Global theme settings
        LocKey: LOCGlobalOptions
        Type: Header
        TitleStyle: TextThemeOptionStyle
        Style: HeaderDockPanelStyle

    UserName:
        Title: Your username
        LocKey: LOCUserName
        Type: String
        Default: User Name  

    PerformanceMode:
        Title: Performance mode
        LocKey: LOCPerformanceMode
        Type: Boolean
        Default: False
        NeedRestart: True
    PerfNote:
        Title: Disables most effects and animations for smoother performance
        LocKey: LOCPerformanceModeDesc
        Type: Header
        TitleStyle: TextThemeOptionStyleMini
        Style: HeaderDockPanelStyleMini

    Corner:
        Title: Interface corner radius
        LocKey: LOCCorner
        Type: CornerRadius
        Default: 15
        Slider:
            Min: 5
            Max: 25
            Step: 10

    OpacityBar:
        Title: Top Bar Transparency
        LocKey: LOCOpacityTopBar
        Type: Double
        Default: 0.6
        Slider:
            Min: 0
            Max: 1
            Step: 0.1

    OpacityBottomBar:
        Title: Bottom Bar Transparency
        LocKey: LOCOpacityBottomBar
        Type: Double
        Default: 0.8
        Slider:
            Min: 0
            Max: 1
            Step: 0.1

    OpacityGameFrame:
        Title: Game List Background Transparency
        LocKey: LOCOpacityBackgroundListGame
        Type: Double
        Default: 0.6
        Slider:
            Min: 0.4
            Max: 1
            Step: 0.1

    AcceuilOrNot:
        Title: Show login screen at startup
        LocKey: LOCLoginScreen
        Type: Boolean
        Default: True
       

