Variables:

  # -------------------- General --------------------

  PageTitle_General:
    Title: Appearance Settings
    LocKey: LOCCategoryAppearanceTitle
    Type: Header
    HeaderKind: PageTitle
    Category: Appearance
    CategoryOrder: 1

  UserName:
    Title: Choose your username
    LocKey: LOCUserName
    Type: String
    Default: User Name
    Category: Appearance

  Corner:
    Title: Interface corner radius
    Description: Adjusts how rounded the interface panels, buttons, and game covers look. Lower values are sharper, higher values are more rounded.
    LocKey: LOCCorner
    DescriptionLocKey: LOCCornerDesc
    Type: CornerRadius
    Default: 15
    Category: Appearance
    Slider:
      Min: 5
      Max: 25
      Step: 10

  PerformanceMode:
    Title: Performance mode
    LocKey: LOCPerformanceMode
    Type: Boolean
    Default: false
    NeedRestart: true
    Category: Appearance
    Description: Disables most visual effects and animations to make the interface smoother on lower-end systems.
    DescriptionLocKey: LOCPerformanceModeDesc

  AcceuilOrNot:
    Title: Show login screen on startup
    LocKey: LOCLoginScreen
    Type: Boolean
    Default: false
    Category: Appearance
    Description: Shows the login screen when Playnite starts. Disable this to go directly to the main interface.
    DescriptionLocKey: LOCShowLoginScreenOnStartupDesc
    Preview: Themes Option\10.Preview\AcceuilOrNot.jpg

  NoGameStatut:
    Title: Hide Playnite game status screen
    LocKey: LOCNoGameStatut
    Type: Boolean
    Default: false
    Category: Appearance
    Description: Hides Playnite’s default screen shown after launching a game, with the game background, launch message, and return button. This does not affect Aniki’s custom splash screen.
    DescriptionLocKey: LOCNoGameStatutDesc
    Preview: Themes Option\10.Preview\NoGameStatut.jpg


  # -------------------- Main View --------------------

  PageTitle_MainView:
    Title: Main View
    LocKey: LOCCategoryMainViewTitle
    Type: Header
    HeaderKind: PageTitle
    Category: Main View
    CategoryOrder: 2

  AutoHideTopButtonBar:
    Title: Auto-hide top button bar
    LocKey: LOCAutoHideTopButtonBar
    Type: Boolean
    Default: false
    Category: Main View
    Description: Automatically hides the top button bar to keep the screen clean. The bar will appear again when you navigate to the top of the screen.
    DescriptionLocKey: LOCAutoHideTopButtonBarDesc
    Preview: Themes Option\10.Preview\AutoHideTopButtonBar.jpg


  AutoHideBottomFilterBar:
    Title: Auto-hide bottom filter bar
    LocKey: LOCAutoHideBottomFilterBar
    Type: Boolean
    Default: true
    Category: Main View
    Description: Automatically hides the bottom filter bar to keep the screen clean. The bar will appear again when you navigate to the bottom of the screen.
    DescriptionLocKey: LOCAutoHideBottomFilterBarDesc
    Preview: Themes Option\10.Preview\AutoHideBottomFilterBar.jpg


  DisableCenterTopButtons:
    Title: Disable center top bar buttons
    LocKey: LOCDisableCenterTopButtons
    Type: Boolean
    Default: false
    NeedRestart: false
    Category: Main View
    Description: Completely disables the center buttons in the top bar, such as Main Menu, Hub, Layout, Filters, Search. Use controller shortcuts instead.
    DescriptionLocKey: LOCDisableCenterTopButtonsDesc
    Preview: Themes Option\10.Preview\DisableFilterBottomBar.jpg


  DisableFilterBottomBar:
    Title: Disable bottom filter bar
    LocKey: LOCDisableFilterBottomBar
    Type: Boolean
    Default: false
    NeedRestart: false
    Category: Main View
    Description: Completely disables the bottom filter preset bar. This is different from auto-hide. When enabled, the filter bar is disabled entirely.
    DescriptionLocKey: LOCDisableFilterBottomBarDesc


  OpacityBar:
    Title: Top bar opacity
    LocKey: LOCOpacityTopBar
    Description: Changes how visible the top bar background is. 0 is fully transparent, 1 is fully opaque.
    DescriptionLocKey: LOCOpacityTopBarDesc
    Preview: Themes Option\10.Preview\OpacityBar.jpg
    Type: Double
    Default: 0.6
    Category: Main View
    Slider:
      Min: 0
      Max: 1
      Step: 0.1

  OpacityBottomBar:
    Title: Bottom filter bar opacity
